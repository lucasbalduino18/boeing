<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>PMDG 737 Pedestal Tablet</title>
  <style>
    :root { --text:#e6e6e6; --amber:#f4b33c; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      margin:0; min-height:0vh; background:radial-gradient(circle at 50% 20%, #303030, #050505 70%);
      font-family:Arial, Helvetica, sans-serif; color:var(--text); display:flex; align-items:center; justify-content:center; overflow:auto;
    }
    
    
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:8px; background:#b33; box-shadow:0 0 8px #b33; }
    .dot.online { background:#3bd267; box-shadow:0 0 10px #3bd267; }

    /* Bridge indicator square */
    .bridge-indicator {
      width:18px; height:18px; border-radius:4px; cursor:pointer;
      background:#b33; box-shadow:0 0 6px #b33; border:1px solid rgba(255,255,255,.15);
      transition:background .3s, box-shadow .3s;
      flex-shrink:0;
    }
    .bridge-indicator.online { background:#3bd267; box-shadow:0 0 8px #3bd267; }

    /* Bridge IP modal overlay */
    .bridge-modal-overlay {
      display:none; position:fixed; inset:0; z-index:9999;
      background:rgba(0,0,0,.7); align-items:center; justify-content:center;
    }
    .bridge-modal-overlay.open { display:flex; }
    .bridge-modal {
      background:#1a1a1a; border:1px solid #444; border-radius:10px;
      padding:22px 26px; min-width:300px; max-width:90vw;
      box-shadow:0 8px 32px rgba(0,0,0,.6);
    }
    .bridge-modal h3 { margin:0 0 14px; font-size:15px; color:#ccc; font-weight:600; letter-spacing:.04em; }
    .bridge-modal label { display:block; font-size:12px; color:#888; margin-bottom:5px; }
    .bridge-modal input[type="text"] {
      width:100%; padding:9px 12px; font-size:15px; font-family:monospace;
      background:#111; color:#e6e6e6; border:1px solid #555; border-radius:6px;
      outline:none;
    }
    .bridge-modal input[type="text"]:focus { border-color:#3bd267; }
    .bridge-modal .btn-row { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
    .bridge-modal button {
      padding:8px 18px; border:none; border-radius:6px; font-size:13px; cursor:pointer;
      font-weight:600; letter-spacing:.03em;
    }
    .bridge-modal .btn-save { background:#3bd267; color:#111; }
    .bridge-modal .btn-save:active { background:#2fa855; }
    .bridge-modal .btn-cancel { background:#333; color:#aaa; }
    .bridge-modal .btn-cancel:active { background:#444; }

    /* FIRE PANEL: salve a imagem em assets/fire-panel-pmdg.png */
    .fire-photo-panel {
	  grid-column:1 / -1;
	  justify-self:center;
	  position:relative;
	  z-index:2;
	  width:min(100%,1180px);
	  aspect-ratio:1508 / 372;
	  min-height:210px;
	  background-image:url("assets/fire-panel-pmdg.png");
	  background-size:cover;
	  background-position:center;
	  border-radius:14px;
	  border:3px solid #050505;
	  box-shadow:inset 0 0 30px #000,0 8px 18px rgba(0,0,0,.65);
	  overflow:hidden;
	}
    .fire-photo-panel::after,.radio-photo-panel::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(circle at 35% 20%,rgba(255,255,255,.05),transparent 25%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.13));
      mix-blend-mode:screen; z-index:1;
    }
    .fire-hotspot,.radio-hotspot {
      position:absolute; background:rgba(255,255,255,0); border:0; box-shadow:none; padding:0; cursor:pointer; z-index:5; border-radius:10px; touch-action:none;
    }
    .fire-hotspot:active,.radio-hotspot:active { background:rgba(255,255,255,.08); }
    .fire-debug {
      position:relative;
      width:100%;
      text-align:right;
      margin-top:0px;
      padding:0px 10px;
      color:#f2b44c;
      font-size:8px;
      letter-spacing:.06em;
      background:rgba(0,0,0,0);
      border-radius:6px;
    }
    .eng1-handle { left:18.2%; top:19.5%; width:7.8%; height:75%; }
    .eng1-disch-l { left:14.2%; top:50.0%; width:3.9%; height:30%; }
    .eng1-disch-r { left:26.1%; top:50.0%; width:3.9%; height:30%; }
    .apu-handle { left:46.0%; top:19.5%; width:7.4%; height:75%; }
    .apu-disch-l { left:42.0%; top:50%; width:3.9%; height:30%; }
    .apu-disch-r { left:53.5%; top:50%; width:3.9%; height:30%; }
    .eng2-handle { left:73.0%; top:19.5%; width:7.8%; height:78%; }
    .eng2-disch-l { left:69.0%; top:50.0%; width:3.9%; height:30%; }
    .eng2-disch-r { left:79.9%; top:50.0%; width:3.9%; height:30%; }

    .fire-overlay {
      position:absolute; z-index:6; pointer-events:none; opacity:1;
      width:auto; height:auto; object-fit:contain;
      transition:opacity .15s ease, transform .25s ease, filter .15s ease;
      transform-origin:center bottom;
    }
    .fire-overlay.active {
      animation:fireBlink 1s infinite alternate;
    }
    .fire-overlay.pulled { transform:scale(1.08) translateY(-3%); }
    .fire-overlay.pulled.active { transform:scale(1.08) translateY(-3%); }
    .fire-overlay.turned-left { transform:scale(1.08) translateY(-3%) rotate(-8deg); }
    .fire-overlay.turned-right { transform:scale(1.08) translateY(-3%) rotate(8deg); }
    .fire-overlay.turned-left.active { transform:scale(1.08) translateY(-3%) rotate(-8deg); }
    .fire-overlay.turned-right.active { transform:scale(1.08) translateY(-3%) rotate(8deg); }

    /* Fire glow overlay — sits on top of the handle image */
    .fire-glow {
      position:absolute; z-index:7; pointer-events:none; opacity:0;
      border-radius:6px;
      background:radial-gradient(ellipse at 50% 40%, rgba(255,60,20,.55) 0%, rgba(200,0,0,.35) 50%, transparent 80%);
      mix-blend-mode:screen;
      transition:opacity .2s ease, transform .25s ease;
      transform-origin:center bottom;
    }
    .fire-glow.active {
      opacity:1;
      animation:fireGlowBlink 1s infinite alternate;
    }
    .fire-glow.pulled { transform:scale(1.08) translateY(-3%); }
    .fire-glow.pulled.active { transform:scale(1.08) translateY(-3%); }
    .fire-glow.turned-left { transform:scale(1.08) translateY(-3%) rotate(-8deg); }
    .fire-glow.turned-right { transform:scale(1.08) translateY(-3%) rotate(8deg); }
    .fire-glow.turned-left.active { transform:scale(1.08) translateY(-3%) rotate(-8deg); }
    .fire-glow.turned-right.active { transform:scale(1.08) translateY(-3%) rotate(8deg); }
    .overlay-eng1 { left:18.2%; top:21.5%; height:75%; transform:rotate(1deg); }
    .overlay-apu  { left:46%; top:21.5%; height:75%; }
    .overlay-eng2 { left:73%; top:21.5%; height:75%; }
    .glow-eng1 { left:18.2%; top:21.5%; width:7.2%; height:75%; }
    .glow-apu  { left:46%; top:21.5%; width:6.9%; height:75%; }
    .glow-eng2 { left:73%; top:21.5%; width:7.2%; height:75%; }
    @keyframes fireBlink { 0%{filter:brightness(1);} 100%{filter:brightness(1.3);} }
    @keyframes fireGlowBlink { 0%{opacity:.7;} 100%{opacity:1;} }

    .annun {
      position:absolute;
      z-index:5;
      pointer-events:none;
      opacity:0;
      transition:opacity .12s ease;
    }

    .annun.active {
      opacity:1;
      filter:drop-shadow(0 0 6px rgba(255,180,0,.8));
    }   
	
    .annun-fault { left:31.7%; top:26.8%; width:10.1%; height:18.5%; opacity: 0.2;}
    .annun-apu-det-inop { left:31.7%; top:50.8%; width:10.1%; height:18.5%; opacity: 0.2;}
	.annun-wheel-well { left:31.9%; top:6%; width:10.3%; height: 19%; opacity: 0.2;}
	.annun-eng1-overheat { left:6.8%; top:42.9%; width:9.5%; height: 19%; opacity: 0.2;}
    .annun-apu-bottle { left:31.7%; top:74%; width:10%; opacity: 0.2;}
    .annun-eng2-overheat { left:59.3%; top:42.5%; width:10%; height: 22%; opacity: 0.2;}	
    .annun-l-bottle { left:71.0%; top:8.0%; width:10%; height: 19%; z-index: 1; opacity: 0.2;}
    .annun-r-bottle { left:81.5%; top:7.0%; width:10%; height: 20.6%; opacity: 0.2;}

    .annun-overlay.active {
      opacity:1;
      animation: annunBlink .55s infinite alternate;
    }

    @keyframes annunBlink {
      0% { filter:brightness(.75); }
      100% { filter:brightness(1.8); }
    }

    /* RADIO PANEL:  */
    .radio-photo-panel {
      position:relative; width:100%; aspect-ratio:730 / 672; min-height:360px;
      background-image:url("assets/radio-vhf-nav-pmdg.png"); background-size:cover; background-position:center;
      border-radius:8px; border:3px solid #050505; box-shadow:inset 0 0 30px #000,0 8px 18px rgba(0,0,0,.65); overflow:hidden;
    }
    .photo-display {
      position:absolute; font-family:"Courier New", monospace; font-weight:500; color:var(--amber);
      text-shadow:0 0 7px rgba(255,160,30,.75),0 0 13px rgba(255,140,20,.28);
      letter-spacing:-.10em; text-align:center; line-height:1; z-index:3; pointer-events:none; transform:scaleY(0.74); white-space:nowrap; overflow:hidden;
    }
    .vhf-active  { left:13.8%; top:14.5%; width:30.1%; font-size:clamp(18px,3.15vw,30px); }
    .vhf-standby { left:58.2%; top:14.5%; width:30.1%; font-size:clamp(18px,3.15vw,30px); }
    .nav-active  { left:12.8%; top:62.8%; width:29.9%; font-size:clamp(18px,3.15vw,30px); }
    .nav-standby { left:58.0%; top:62.8%; width:30.1%; font-size:clamp(18px,3.15vw,30px); }

    .vhf-swap { left:47.9%; top:13.2%; width:6.3%; height:6%; }
    .nav-swap { left:47.2%; top:61.3%; width:6.3%; height:6%; }

    /* VHF right knob split into 4 zones */
    .vhf-mhz-inc { left:75.6%; top:28.2%; width:7.75%; height:9.5%; }
    .vhf-khz-inc { left:83.35%; top:28.2%; width:7.75%; height:9.5%; }
    .vhf-mhz-dec { left:75.6%; top:37.7%; width:7.75%; height:9.5%; }
    .vhf-khz-dec { left:83.35%; top:37.7%; width:7.75%; height:9.5%; }

    /* NAV right knob split into 4 zones */
    .nav-mhz-inc { left:74.6%; top:76.0%; width:8.75%; height:9.5%; }
    .nav-khz-inc { left:83.35%; top:76.0%; width:8.75%; height:9.5%; }
    .nav-mhz-dec { left:74.6%; top:85.5%; width:8.75%; height:9.5%; }
    .nav-khz-dec { left:83.35%; top:85.5%; width:8.75%; height:9.5%; }

    /* Subtle always-visible click zones */
    .radio-hotspot::after {
      content:""; position:absolute; inset:0; border-radius:8px; background:rgba(0,180,255,.08); outline:1px solid rgba(0,180,255,.18);
      opacity:1; pointer-events:none; transition:background .15s ease, outline .15s ease;
    }
    .radio-hotspot:active::after { background:rgba(0,180,255,.18); outline:1px solid rgba(0,220,255,.42); }
    .vhf-mhz-inc::before,.vhf-khz-inc::before,.vhf-mhz-dec::before,.vhf-khz-dec::before,.nav-mhz-inc::before,.nav-khz-inc::before,.nav-mhz-dec::before,.nav-khz-dec::before {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(to right,transparent 48%,rgba(0,220,255,.22) 49%,rgba(0,220,255,.22) 51%,transparent 52%),linear-gradient(to bottom,transparent 48%,rgba(0,220,255,.22) 49%,rgba(0,220,255,.22) 51%,transparent 52%);
      opacity:.35;
    }
    /* Subtle always-visible masks for FIRE TEST switch zones */
    .fire-test-left,
    .fire-test-right {
      position:absolute;
      top:77%;
      width:3.5%;
      height:18%;
      border-radius:50%;
      z-index:30;
      transition: transform .08s ease, filter .08s ease;
      transform-origin:50% 50%;
    }
	
	
	
	/* warning PANEL: */
    .warning-photo-cap-panel {
      position:relative; width:100%; aspect-ratio:765 / 211; min-height:150px;
      background-image:url("assets/caution-allloff-cap-pmdg.png"); background-size:cover; background-position:center;
      border-radius:8px; border:3px solid #050505; box-shadow:inset 0 0 30px #000,0 8px 18px rgba(0,0,0,.65); overflow:hidden;
    }
	
	.warning-photo-fo-panel {
      position:relative; width:100%; aspect-ratio:765 / 211; min-height:150px;
      background-image:url("assets/caution-allloff-pmdg.png"); background-size:cover; background-position:center;
      border-radius:8px; border:3px solid #050505; box-shadow:inset 0 0 30px #000,0 8px 18px rgba(0,0,0,.65); overflow:hidden;
    }

    /* Warning annunciator overlays */
    .warn-annun {
      position:absolute;
      pointer-events:none;
      z-index:4;
      opacity:0;
      transition:opacity .12s ease;
    }
    .warn-annun.active {
      opacity:1;
      filter:drop-shadow(0 0 6px rgba(255,180,0,.7));
    }
	
	/* Captain caution annunciator grid (right of MASTER CAUTION) */
    /* Layout: 3 rows x 2 cols — FLT CONT/ELEC, IRS/APU, FUEL/OVHT-DET */
    .warn-flct { left:55%; top:5%;  width:18%; height:26%; }
    .warn-elec { left:79%; top:5%;  width:18%; height:26%; }
    .warn-irs  { left:55%; top:36%; width:18%; height:26%; }
    .warn-apu  { left:79%; top:36%; width:18%; height:26%; }
    .warn-fuel { left:55%; top:67%; width:18%; height:26%; }
    .warn-ovht { left:79%; top:67%; width:18%; height:26%; }

    /* Caution text positions (right side 6-panel grid) */
    .warn-anti-ice { left:1%; top:5%; width:18%; height:26%; }
    .warn-eng      { left:27%; top:5%; width:18%; height:26%; }
    .warn-hyd      { left:1%; top:36%; width:18%; height:26%; }
    .warn-overhead { left:27%; top:36%; width:18%; height:26%; }
    .warn-doors    { left:1%; top:67%; width:18%; height:26%; }
    .warn-air-cond { left:27%; top:67%; width:18%; height:26%; }

    /* Master Caution and Fire Warn buttons */
    .warn-master-caution { left:26%; top:9%; width:17.2%; height:63.7%; }
    .warn-fire-warn      { left:2%; top:9.4%; width:17.2%; height:64%; }
	
	.warn-master-caution-fo { left:55%; top:9%; width:17.2%; height:63.7%; }
    .warn-fire-warn-FO      { left:81%; top:9.4%; width:17.4%; height:64%; }

    .warn-master-caution.active,
    .warn-master-caution-fo.active {
      filter:drop-shadow(0 0 10px rgba(255,160,0,.9));
    }
    .warn-fire-warn.active,
    .warn-fire-warn-FO.active {
      filter:drop-shadow(0 0 10px rgba(255,0,0,.9));
    }

    /* Warning annunciator base for FO panel */
    .warn-annun-fo {
      position:absolute;
      pointer-events:none;
      z-index:4;
      opacity:0;
      transition:opacity .12s ease;
    }
    .warn-annun-fo.active {
      opacity:1;
      filter:drop-shadow(0 0 6px rgba(255,180,0,.7));
    }

    /* Clickable areas for Master Caution and Fire Warn */
    .warn-btn-master-caution { left:25%; top:6.5%; width:19%; height:72%; filter: brightness(.5);}
    .warn-btn-fire-warn      { left:1%; top:6.5%; width:20%; height:72%; filter: brightness(.5);}
    .warn-btn-master-fo-caution { left:54%; top:6.5%; width:20%; height:72%; filter: brightness(.5);}
    .warn-btn-fire-fo-warn      { left:80%; top:6.5%; width:20%; height:72%; filter: brightness(.5);}


	.recall-btn { left:53%; top:2%; width:45%; height:90%; filter: brightness(.5);}
	.recall-fo-btn { left:2%; top:2%; width:45%; height:90%; filter: brightness(.5);}
	
    
    .recall-btn:active,
    .recall-btn.pressed {
      filter: brightness(.8);
    }
	
	.recall-fo-btn:active,
    .recall-fo-btn.pressed {
      filter: brightness(.8);
    }

    .fire-test-left { left:7.2%; }
    .fire-test-right { left:13.6%; }

    .fire-test-left:active,
    .fire-test-right:active,
    .fire-test-left.pressed,
    .fire-test-right.pressed {
      filter: brightness(.8);
    }

    .fire-test-lever {
      position:absolute;
      left:9.9%;
      top:83.0%;
      width:3.1%;
      height:4.8%;
      z-index:29;
      pointer-events:none;
      border-radius:18px;
      background:linear-gradient(135deg,#d8d8d8,#727272 48%,#232323);
      box-shadow:
        0 2px 4px rgba(0,0,0,.75),
        inset 0 1px 2px rgba(255,255,255,.55),
        inset 0 -2px 3px rgba(0,0,0,.65);
      transform-origin:50% 50%;
      transform:rotate(0deg) translateY(0);
      transition:transform .09s ease, filter .09s ease;
    }

    .fire-test-lever.to-left {
      transform:rotate(-28deg) translateX(-8%) translateY(8%);
      filter:brightness(.82);
    }

    .fire-test-lever.to-right {
      transform:rotate(28deg) translateX(8%) translateY(8%);
      filter:brightness(.82);
    }

    .fire-test-left::after,
    .fire-test-right::after,
    .fire-test::after {
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:rgba(0,180,255,.10);
      outline:1px solid rgba(0,180,255,.24);
      pointer-events:none;
    }

    .fire-test-left:active::after,
    .fire-test-right:active::after,
    .fire-test:active::after {
      background:rgba(0,220,255,.22);
      outline:1px solid rgba(0,220,255,.55);
      box-shadow:0 0 10px rgba(0,220,255,.35);
    }

	.ext-led.active {

	}

	.ext-led-l   { left:84.5%; top:67.5%; }
	.ext-led-r   { left:89.3%; top:67.9%; }
	.ext-led-apu { left:87.0%; top:82.5%; }

	  height:28%;

	}

	.ext-test-right {
	  left:85.5%;
	  width:3.0%;
	}

.ext-test-left::after,
.ext-test-right::after {
  content:"";
  position:absolute;
  inset:0;
  border-radius:10px;
  background:rgba(0,180,255,.10);
  outline:1px solid rgba(0,180,255,.25);
  pointer-events:none;
}

.ovht1-b,

.eng1-disch-r::after,
.apu-handle::after,
.apu-disch-l::after,
.apu-disch-r::after,
.eng2-handle::after,
.eng2-disch-l::after,
.eng2-disch-r::after {
  content:"";
  position:absolute;
  inset:0;
  border-radius:10px;
  background:rgba(0,180,255,.08);
  outline:1px solid rgba(0,180,255,.18);
  pointer-events:none;
}

.eng1-handle:active::after,
.eng1-disch-l:active::after,
.eng1-disch-r:active::after,

  <script>
    const DEFAULT_BRIDGE_IP = '192.168.1.61';
    const BRIDGE_PORT = '7373';

    function getBridgeIp() {
      return localStorage.getItem('pmdg_bridge_ip') || DEFAULT_BRIDGE_IP;
    }
    function setBridgeIp(ip) {
      localStorage.setItem('pmdg_bridge_ip', ip);
    }
    function buildBridgeUrl(ip) {
      return `ws://${ip}:${BRIDGE_PORT}`;

    function send(command) {
      const fireDebug = document.getElementById('fire-debug');
      if (fireDebug && command.type === 'pmdgFire') fireDebug.textContent = `${command.target.toUpperCase()} ${command.action.toUpperCase()} SENT`;
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(command));
    }
    function clampFrequency(id, value) {
      if (id.startsWith('vhf')) return Math.min(136.975, Math.max(118.000, value));
      if (id.startsWith('vor')) return Math.min(117.95, Math.max(108.00, value));
	  if (id.startsWith('adf')) return Math.min(1799, Math.max(190, value));
      return value;
    }
    function numericFormat(id, value) {
      value = clampFrequency(id, value);
      if (id.startsWith('vhf')) return value.toFixed(3);
      if (id.startsWith('vor')) return value.toFixed(2);
	  if (id.startsWith('adf')) return value.toFixed(0);
      return String(value);
    }
    // Radio cooldown — ignore bridge broadcasts briefly after local tuning
    const radioCooldown = {};

    function changeStandby(id, delta) {
  const r = state[id];

  let current = Number(r.standby);

  if (!Number.isFinite(current)) {
    current = id.startsWith('adf') ? 400 : Number(r.active);
  }

  let value = current + delta;
  r.standby = numericFormat(id, value);

  renderRadio(id);

  // Set cooldown to ignore bridge broadcasts for this radio
  radioCooldown[id] = Date.now() + 1500;

  send({
    type: 'setStandby',
    radio: id,
    value: r.standby
  });
}
    function changeVhfStandby(id, part, direction) {
      if (!id.startsWith('vhf')) return;
      changeStandby(id, part === 'mhz' ? direction * 1.000 : direction * 0.025);
    }
    function changeNavStandby(id, part, direction) {
      if (!id.startsWith('vor')) return;
      changeStandby(id, part === 'mhz' ? direction * 1.000 : direction * 0.05);
    }
	function changeAdfStandby(id, part, direction) {
	   if (!id.startsWith('adf')) return;
	   changeStandby(id, part === 'mhz' ? direction * 1.0 : direction * 0.5);
	}

        if (!overlay) continue;
        overlay.classList.remove('pulled','turned-left','turned-right');
        if (glow) glow.classList.remove('pulled','turned-left','turned-right');
        if (pos === 2) { overlay.classList.add('pulled'); if (glow) glow.classList.add('pulled'); }
        if (pos === 3) { overlay.classList.add('pulled','turned-left'); if (glow) glow.classList.add('pulled','turned-left'); }

    const repeatTuneActions = new Set(['vhfMhzInc','vhfKhzInc','vhfMhzDec','vhfKhzDec','navMhzInc','navKhzInc','navMhzDec','navKhzDec','adfMhzInc','adfKhzInc','adfMhzDec','adfKhzDec','rudder_trim_left','rudder_trim_right','ail_trim_left','ail_trim_right']);
    function runTuneAction(action, id) {
      if (action === 'vhfMhzInc') return changeVhfStandby(selectedVhfForPanelId(id),'mhz',1);
      if (action === 'vhfKhzInc') return changeVhfStandby(selectedVhfForPanelId(id),'khz',1);
      if (action === 'vhfMhzDec') return changeVhfStandby(selectedVhfForPanelId(id),'mhz',-1);
      if (action === 'vhfKhzDec') return changeVhfStandby(selectedVhfForPanelId(id),'khz',-1);
      if (action === 'navMhzInc') return changeNavStandby(id,'mhz',1);
      if (action === 'navKhzInc') return changeNavStandby(id,'khz',1);
      if (action === 'navMhzDec') return changeNavStandby(id,'mhz',-1);
      if (action === 'navKhzDec') return changeNavStandby(id,'khz',-1);
	  if (action === 'adfMhzInc') return send({ type:'pmdgAdfRotary', action:'outer_inc' });
	  if (action === 'adfMhzDec') return send({ type:'pmdgAdfRotary', action:'outer_dec' });
	  if (action === 'adfKhzInc') return send({ type:'pmdgAdfRotary', action:'inner_inc' });
	  if (action === 'adfKhzDec') return send({ type:'pmdgAdfRotary', action:'inner_dec' });
	  if (action === 'rudder_trim_left') return send({ type:'pmdgRudderTrim', direction:'left' });
	  if (action === 'rudder_trim_right') return send({ type:'pmdgRudderTrim', direction:'right' });
	  if (action === 'ail_trim_left') return send({ type:'pmdgAileronTrim', direction:'left' });
	  if (action === 'ail_trim_right') return send({ type:'pmdgAileronTrim', direction:'right' });
    }
    const rudderActions = new Set(['rudder_trim_left','rudder_trim_right']);
	const ailActions = new Set(['ail_trim_left','ail_trim_right']);
	
    function startTuneRepeat(action, id) {
      let active = true, count = 0, timer;
      const step = () => {
        if (!active) return;
        runTuneAction(action, id);
        count += 1;
        const delay = count < 4 ? 260 : count < 10 ? 150 : count < 20 ? 90 : 55;
        timer = setTimeout(step, delay);
      };
      step();
      const stop = () => {
        active = false; clearTimeout(timer);
        if (rudderActions.has(action)) {
          send({ type:'pmdgRudderTrim', direction:'release' });
          setTrimActive('left', false);
          setTrimActive('right', false);
          setKnobRotation(0);
        }
		if (ailActions.has(action)) {
          send({ type:'pmdgAileronTrim', direction:'release' });
          setTrimActive('left', false);
          setTrimActive('right', false);
        }
        window.removeEventListener('pointerup', stop);
        window.removeEventListener('pointercancel', stop);
        window.removeEventListener('blur', stop);
      };
      window.addEventListener('pointerup', stop, { once:true });
      window.addEventListener('pointercancel', stop, { once:true });
      window.addEventListener('blur', stop, { once:true });
    }

      e.preventDefault();
      flashKnob(target);
      if (action === 'rudder_trim_left') { setTrimActive('left', true); setKnobRotation(-15); }
      if (action === 'rudder_trim_right') { setTrimActive('right', true); setKnobRotation(15); }
      startTuneRepeat(action, id);
    });

if (action === 'xpdr_digit') {
  const digit = target.dataset.digit;
  flashDigit(target);

  if (!/^[0-7]$/.test(digit)) return;

  xpdrInput = (xpdrInput + digit).slice(-4);

  state.xpdr.active = xpdrInput.padStart(4, '0');
  radioCooldown['xpdr'] = Date.now() + 2000;
  renderRadio('xpdr');

  if (xpdrInput.length === 4) {
    send({
      type: 'setStandby',
      radio: 'xpdr',
      value: xpdrInput
    });

    xpdrInput = '';
    radioCooldown['xpdr'] = Date.now() + 2000;
  }

  return;
}

if (action === 'xpdr_clear') {
  flashDigit(target);
  xpdrInput = '';
  state.xpdr.active = '0000';
  renderRadio('xpdr');

    // RECALL — momentary: hold to light all, release to show only active faults
    (function() {
      const btn = document.getElementById('recall-btn-capt');
      if (!btn) return;
      let pressed = false;

      function onPress(e) {
        e.preventDefault();
        if (pressed) return;
        pressed = true;
        btn.classList.add('pressed');
        send({ type:'pmdgWarn', action:'recall_capt', press: 1 });
      }
      function onRelease(e) {
        e.preventDefault();
        if (!pressed) return;
        pressed = false;
        btn.classList.remove('pressed');
        send({ type:'pmdgWarn', action:'recall_capt', press: 0 });
		
      }

      btn.addEventListener('touchstart', onPress, { passive: false });
      btn.addEventListener('touchend', onRelease, { passive: false });
      btn.addEventListener('touchcancel', onRelease, { passive: false });
      btn.addEventListener('mousedown', onPress);
      btn.addEventListener('mouseup', onRelease);
      btn.addEventListener('mouseleave', onRelease);
    })();

    function connect() {
      try {
        ws = new WebSocket(BRIDGE_URL);
        ws.onopen = () => setConnection(true);
        ws.onclose = () => { setConnection(false); setTimeout(connect, 2000); };
        ws.onerror = () => setConnection(false);
        ws.onmessage = event => {
          const data = JSON.parse(event.data);
          if (data.ok === false) {
            const fireDebug = document.getElementById('fire-debug');
            if (fireDebug) fireDebug.textContent = `BRIDGE ERROR: ${data.error}`;
          }
          if (data.fire) renderFireState(data.fire);
          if (data.fireWarn) renderFireWarn(data.fireWarn);
          if (data.annun) renderAnnunciators(data.annun);
		  if (data.extLed) renderExtLeds(data.extLed);
		  if (data.xpdr) renderXpdrState(data.xpdr);
		  if (data.acp) renderAcpState(data.acp);
		  if (data.warn) renderWarnState(data.warn);
		  if (data.cargo) renderCargoState(data.cargo);
		  if (data.rudderTrim !== undefined) {
				renderRudderTrim(data.rudderTrim);
		  }
		  if (data.xpndrStbyMode !== undefined) {
				renderStbyKnob(data.xpndrStbyMode);
		  }
		  if (data.xpndrAbvBlw !== undefined) {
				renderAbvBlwKnob(data.xpndrAbvBlw);
		  }
          if (data.radios) {
            for (const [id, values] of Object.entries(data.radios)) {
              if (!state[id]) continue;

              // Skip if this radio was recently tuned locally (cooldown)
              if (radioCooldown[id] && Date.now() < radioCooldown[id]) continue;

              if (values.active !== undefined && values.active !== null && values.active !== 'NaN') {
  state[id].active = values.active;
}

if (values.standby !== undefined && values.standby !== null && values.standby !== 'NaN') {
  state[id].standby = String(values.standby);
}

renderRadio(id);
            }
          }
        };
      } catch (err) { setConnection(false); }
    }
    renderVhfPanels();
    connect();
  </script>
